<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MII Global Team</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #181c2a;
      --surface-2: #1e2234;
      --border: #282e45;
      --border-light: #323854;
      --text: #e8eaf6;
      --muted: #5a6182;
      --accent: #6366f1;
      --accent-bright: #818cf8;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── LOADING SCREEN ── */
    .loading-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; z-index: 999;
      transition: opacity 0.4s;
    }
    .loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-label { font-size: 0.85rem; color: var(--muted); }

    /* ── SYNC INDICATOR ── */
    .sync-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      margin-right: 6px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── HEADER ── */
    .app-header {
      padding: 12px 28px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0;
      background: rgba(15,17,23,0.94);
      backdrop-filter: blur(12px);
      z-index: 50;
    }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-img { height: 36px; width: auto; display: block; }
    .logo-mark {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 8px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      flex-shrink: 0;
    }
    .logo-text-group { display: flex; flex-direction: column; gap: 1px; }
    .logo-title { font-size: 1rem; font-weight: 700; color: var(--text); letter-spacing: -0.3px; line-height: 1; }
    .logo-sub { font-size: 0.68rem; color: var(--muted); font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .my-time-chip {
      font-size: 0.82rem; color: var(--muted);
      background: var(--surface); border: 1px solid var(--border);
      padding: 5px 12px; border-radius: 20px;
    }
    .my-time-chip strong { color: var(--text); font-variant-numeric: tabular-nums; }

    /* ── BUTTONS ── */
    .btn {
      cursor: pointer; border: none; border-radius: 9px;
      padding: 8px 16px; font-size: 0.85rem; font-weight: 500;
      transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; line-height: 1;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-bright); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--border-light); background: var(--surface-2); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 5px 11px; font-size: 0.78rem; }

    /* ── SCHEDULER ── */
    .scheduler-wrap {
      margin: 20px 28px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
    }
    .scheduler-toggle {
      padding: 14px 20px; display: flex; align-items: center;
      justify-content: space-between; cursor: pointer; user-select: none;
    }
    .scheduler-toggle:hover { background: var(--surface-2); }
    .scheduler-toggle-title {
      display: flex; align-items: center; gap: 9px;
      font-weight: 600; font-size: 0.9rem; color: var(--accent-bright);
    }
    .chevron { transition: transform 0.2s; color: var(--muted); }
    .chevron.up { transform: rotate(180deg); }
    .scheduler-body { padding: 0 20px 20px; border-top: 1px solid var(--border); }
    .scheduler-inputs { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 16px; }
    .scheduler-inputs label { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
    .sched-input {
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); padding: 8px 12px; border-radius: 9px;
      font-size: 0.875rem; color-scheme: dark; transition: border-color 0.15s;
    }
    .sched-input:focus { outline: none; border-color: var(--accent-bright); }
    .sched-legend { display: flex; gap: 14px; margin-top: 12px; font-size: 0.75rem; color: var(--muted); flex-wrap: wrap; }
    .sched-legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .sched-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 14px; }
    .sched-card {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 13px;
      display: flex; align-items: center; gap: 10px; transition: border-color 0.2s;
    }
    .sched-card.good { border-color: rgba(34,197,94,0.35); }
    .sched-card.ok   { border-color: rgba(245,158,11,0.35); }
    .sched-card.bad  { border-color: rgba(99,102,241,0.15); opacity: 0.7; }
    .sched-mini-av {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 700; color: #fff;
      flex-shrink: 0; overflow: hidden;
    }
    .sched-mini-av img { width: 100%; height: 100%; object-fit: cover; }
    .sched-info { flex: 1; min-width: 0; }
    .sched-name  { font-size: 0.75rem; color: var(--muted); margin-bottom: 1px; }
    .sched-time  { font-size: 0.95rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sched-day   { font-size: 0.73rem; color: var(--muted); }
    .sched-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .sched-empty { color: var(--muted); font-size: 0.85rem; padding: 8px 0; }

    /* ── TEAM SECTION ── */
    .team-section { padding: 0 28px 40px; }
    .team-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 14px; }
    .team-count { font-size: 0.82rem; color: var(--muted); }
    .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }

    /* ── PERSON CARD ── */
    .person-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; overflow: hidden; position: relative;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .person-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.45); border-color: var(--border-light); }
    .card-stripe { height: 5px; }
    .card-body { padding: 18px 18px 16px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .av-wrap { position: relative; margin-bottom: 12px; }
    .av {
      width: 72px; height: 72px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.45rem; font-weight: 700; color: #fff;
      position: relative; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      overflow: hidden; cursor: pointer;
    }
    .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .av-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s; border-radius: 50%;
    }
    .av:hover .av-overlay { opacity: 1; }
    .av-status {
      position: absolute; bottom: 3px; right: 3px;
      width: 15px; height: 15px; border-radius: 50%;
      border: 2.5px solid var(--surface); z-index: 2;
    }
    .travel-tag {
      font-size: 0.68rem; font-weight: 600;
      background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3);
      color: var(--amber); padding: 2px 9px; border-radius: 20px;
      margin-bottom: 5px; display: inline-flex; align-items: center; gap: 4px;
    }
    .person-name { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.2px; }
    .person-time-row { display: flex; align-items: baseline; gap: 3px; margin-bottom: 3px; }
    .person-time { font-size: 2.4rem; font-weight: 800; letter-spacing: -2px; font-variant-numeric: tabular-nums; line-height: 1; }
    .person-ampm { font-size: 1rem; font-weight: 400; color: var(--muted); letter-spacing: 0; }
    .person-date { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; }
    .person-loc { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 4px; max-width: 100%; margin-bottom: 2px; }
    .person-loc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .home-loc { font-size: 0.7rem; color: var(--muted); opacity: 0.55; margin-bottom: 2px; }
    .card-actions { display: flex; gap: 7px; margin-top: 14px; width: 100%; }
    .card-btn {
      flex: 1; padding: 7px 0; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 9px;
      color: var(--muted); font-size: 0.77rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .card-btn:hover { color: var(--text); border-color: var(--border-light); background: var(--surface); }
    .card-btn.traveling { color: var(--amber); border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.07); }
    .card-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── ADD CARD ── */
    .add-card {
      background: transparent; border: 2px dashed var(--border);
      border-radius: 18px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      cursor: pointer; min-height: 300px; color: var(--muted); transition: all 0.2s;
    }
    .add-card:hover { border-color: var(--accent-bright); color: var(--accent-bright); background: rgba(99,102,241,0.04); }
    .add-card-circle {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--surface); display: flex; align-items: center; justify-content: center;
    }
    .add-card span { font-size: 0.85rem; font-weight: 500; }

    /* ── MODAL ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; backdrop-filter: blur(6px);
    }
    .modal {
      background: var(--surface); border: 1px solid var(--border-light);
      border-radius: 20px; padding: 28px; width: 440px;
      max-width: calc(100vw - 36px); max-height: calc(100vh - 40px);
      overflow-y: auto; animation: pop-in 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes pop-in {
      from { opacity: 0; transform: scale(0.93) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 22px; display: flex; align-items: center; gap: 9px; }
    .form-row { margin-bottom: 14px; }
    .form-row label {
      display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted);
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .form-row input, .form-row select {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); padding: 10px 13px; border-radius: 10px;
      font-size: 0.9rem; transition: border-color 0.15s;
    }
    .form-row input:focus, .form-row select:focus { outline: none; border-color: var(--accent-bright); }

    /* ── PHOTO UPLOAD ── */
    .photo-section { margin-bottom: 18px; }
    .photo-section-label {
      font-size: 0.8rem; font-weight: 600; color: var(--muted);
      margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.04em; display: block;
    }
    .photo-upload-row { display: flex; align-items: center; gap: 14px; }
    .photo-circle-btn {
      width: 72px; height: 72px; border-radius: 50%;
      border: 2px dashed var(--border-light);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; position: relative;
      overflow: hidden; transition: border-color 0.2s;
      background: var(--surface-2); font-size: 1.3rem; font-weight: 700; color: #fff;
    }
    .photo-circle-btn:hover { border-color: var(--accent-bright); }
    .photo-circle-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-circle-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s; border-radius: 50%;
    }
    .photo-circle-btn:hover .photo-circle-overlay { opacity: 1; }
    .photo-upload-controls { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .photo-upload-controls input[type="text"] {
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); padding: 8px 12px; border-radius: 9px; font-size: 0.82rem; width: 100%;
    }
    .photo-upload-controls input[type="text"]:focus { outline: none; border-color: var(--accent-bright); }
    .photo-hint { font-size: 0.72rem; color: var(--muted); }
    .photo-remove-btn { font-size: 0.75rem; color: var(--red); background: none; border: none; cursor: pointer; padding: 0; opacity: 0.8; }
    .photo-remove-btn:hover { opacity: 1; }

    /* ── CITY AUTOCOMPLETE ── */
    .city-wrap { position: relative; }
    .city-dropdown {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--surface-2); border: 1px solid var(--border-light);
      border-top: none; border-radius: 0 0 10px 10px;
      max-height: 210px; overflow-y: auto; z-index: 20;
    }
    .city-opt {
      padding: 9px 13px; cursor: pointer; font-size: 0.875rem;
      display: flex; justify-content: space-between; align-items: center; transition: background 0.1s;
    }
    .city-opt:hover { background: var(--surface); }
    .city-tz { font-size: 0.72rem; color: var(--muted); }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
    .modal-divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
    .remove-btn {
      width: 100%; background: transparent; border: 1px solid rgba(239,68,68,0.3);
      color: var(--red); padding: 8px; border-radius: 9px;
      font-size: 0.83rem; cursor: pointer; transition: all 0.15s; font-weight: 500;
    }
    .remove-btn:hover { background: rgba(239,68,68,0.1); border-color: var(--red); }

    /* ── SAVING TOAST ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--surface); border: 1px solid var(--border-light);
      color: var(--text); padding: 10px 20px; border-radius: 20px;
      font-size: 0.85rem; font-weight: 500; z-index: 300;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      opacity: 0; white-space: nowrap;
      display: flex; align-items: center; gap: 8px;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .app-header { padding: 12px 16px; }
      .scheduler-wrap { margin-left: 16px; margin-right: 16px; }
      .team-section { padding-left: 16px; padding-right: 16px; }
      .team-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .my-time-chip { display: none; }
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
  </style>
</head>
<body>

<!-- LOADING SCREEN -->
<div class="loading-screen" id="loading-screen">
  <div class="spinner"></div>
  <div class="loading-label">Connecting to MII Global Team…</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- HEADER -->
<header class="app-header">
  <div class="logo">
    <img src="mii-logo.png" alt="MII" class="logo-img" id="logo-img"
         onerror="this.style.display='none';document.getElementById('logo-mark-fallback').style.display='flex'">
    <div class="logo-mark" id="logo-mark-fallback" style="display:none">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="1.8">
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/>
      </svg>
    </div>
    <div class="logo-text-group">
      <span class="logo-title">MII Global Team</span>
      <span class="logo-sub"><span class="sync-dot"></span>Live</span>
    </div>
  </div>
  <div class="header-right">
    <div class="my-time-chip">My time: <strong id="my-time">--:--</strong></div>
    <button class="btn btn-primary" onclick="openAdd()">
      <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Add Person
    </button>
  </div>
</header>

<!-- SCHEDULER -->
<div class="scheduler-wrap">
  <div class="scheduler-toggle" onclick="toggleSched()">
    <div class="scheduler-toggle-title">
      <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Plan a Meeting
    </div>
    <svg id="sched-chevron" class="chevron up" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </div>
  <div class="scheduler-body" id="sched-body">
    <div class="scheduler-inputs">
      <label>My time</label>
      <input class="sched-input" type="datetime-local" id="sched-dt" oninput="renderSched()">
      <span style="font-size:0.8rem;color:var(--muted)" id="my-tz-label"></span>
    </div>
    <div class="sched-legend">
      <div class="sched-legend-item"><div class="legend-dot" style="background:var(--green)"></div> Working hours (9am–6pm)</div>
      <div class="sched-legend-item"><div class="legend-dot" style="background:var(--amber)"></div> Early/Evening (7–9am, 6–9pm)</div>
      <div class="sched-legend-item"><div class="legend-dot" style="background:var(--muted)"></div> Outside hours</div>
    </div>
    <div class="sched-results" id="sched-results">
      <p class="sched-empty">Pick a date and time above to see when it lands for each teammate.</p>
    </div>
  </div>
</div>

<!-- TEAM GRID -->
<section class="team-section">
  <div class="team-bar"><span class="team-count" id="team-count"></span></div>
  <div class="team-grid" id="team-grid"></div>
</section>

<!-- MODAL: Add / Edit -->
<div class="overlay" id="person-overlay" style="display:none" onclick="if(event.target===this)closePersonModal()">
  <div class="modal">
    <div class="modal-title" id="person-modal-title">Add Team Member</div>
    <div class="photo-section">
      <span class="photo-section-label">Photo</span>
      <div class="photo-upload-row">
        <div class="photo-circle-btn" id="m-photo-circle" onclick="document.getElementById('m-photo-file').click()">
          <div class="photo-circle-overlay">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
              <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
        </div>
        <input type="file" id="m-photo-file" accept="image/*" style="display:none" onchange="handlePhotoFile(this)">
        <div class="photo-upload-controls">
          <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('m-photo-file').click()">
            <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Upload photo
          </button>
          <input type="text" id="m-photo-url" placeholder="Or paste image URL…" oninput="handlePhotoUrl(this.value)" autocomplete="off">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span class="photo-hint">JPG, PNG, WebP or any image URL</span>
            <button class="photo-remove-btn" id="m-photo-remove" onclick="clearPhoto()" style="display:none">✕ Remove</button>
          </div>
        </div>
      </div>
    </div>
    <input type="hidden" id="m-photo-val">
    <div class="form-row">
      <label>Name</label>
      <input id="m-name" type="text" placeholder="e.g. Hannah">
    </div>
    <div class="form-row">
      <label>Home City</label>

function nameColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return AV_COLORS[Math.abs(h) % AV_COLORS.length];
}
function initials(name) {
  return name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

// ─────────────────────────────────────────
// TIME HELPERS
// ─────────────────────────────────────────
function activeTz(p) { return (p.traveling && p.travelTz) ? p.travelTz : p.tz; }
function fmtTime(tz) {
  return new Intl.DateTimeFormat('en-US', {timeZone:tz, hour:'numeric', minute:'2-digit', hour12:true}).format(new Date());
}
function fmtDate(tz) {
  return new Intl.DateTimeFormat('en-US', {timeZone:tz, weekday:'long', month:'short', day:'numeric'}).format(new Date());
}
function localHour(tz, d) {
  return parseInt(new Intl.DateTimeFormat('en-US', {timeZone:tz, hour:'numeric', hour12:false}).format(d || new Date()));
}
function workStatus(tz, d) {
  const h = localHour(tz, d);
  if (h >= 9 && h < 18)                          return {color:'var(--green)',  cls:'good'};
  if ((h >= 7 && h < 9) || (h >= 18 && h < 21)) return {color:'var(--amber)',  cls:'ok'};
  return {color:'var(--muted)', cls:'bad'};
}
function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────
// IMAGE COMPRESSION (keeps Firestore docs small)
// ─────────────────────────────────────────
function compressImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 300;
      const ratio = Math.min(MAX / img.width, MAX / img.height, 1);
      const canvas = document.createElement('canvas');
      canvas.width  = Math.round(img.width  * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = url;
  });
}

async function seedIfEmpty() {
  const snap = await teamCol.get();
  if (snap.empty) {
    const batch = db.batch();
    DEFAULT_TEAM.forEach(p => batch.set(teamCol.doc(String(p.id)), p));
    await batch.commit();
  }
}

async function savePerson(person) {
  await teamCol.doc(String(person.id)).set(person);
}

async function removePersonFromDB(id) {
  await teamCol.doc(String(id)).delete();
}

  const el = document.getElementById('sched-results');
  if (!dtStr) { el.innerHTML = '<p class="sched-empty">Pick a date and time above to see when it lands for each teammate.</p>'; return; }
  const [datePart, timePart] = dtStr.split('T');
  const [y, mo, d] = datePart.split('-').map(Number);
  const [h, m] = timePart.split(':').map(Number);
  const date = new Date(y, mo - 1, d, h, m);
  el.innerHTML = team.map(p => {
    const tz = activeTz(p);
    const color = nameColor(p.name);
    const ws = workStatus(tz, date);
    const timeStr = new Intl.DateTimeFormat('en-US', {timeZone:tz, hour:'numeric', minute:'2-digit', hour12:true}).format(date);
    const dayStr  = new Intl.DateTimeFormat('en-US', {timeZone:tz, weekday:'short', month:'short', day:'numeric'}).format(date);
    const miniInner = p.photo ? `<img src="${escH(p.photo)}" alt="${escH(p.name)}">` : initials(p.name);
    return `
      <div class="sched-card ${ws.cls}">
        <div class="sched-mini-av" style="background:${p.photo ? '#1e2234' : color}">${miniInner}</div>
        <div class="sched-info">
          <div class="sched-name">${escH(p.name)}</div>
          <div class="sched-time">${timeStr}</div>
          <div class="sched-day">${dayStr}</div>
        </div>
        <div class="sched-status" style="background:${ws.color}"></div>
      </div>`;
  }).join('');
}
function initSchedTime() {
  const now = new Date();
  now.setMinutes(now.getMinutes() < 30 ? 0 : 30);
  now.setSeconds(0); now.setMilliseconds(0);
  document.getElementById('sched-dt').value =
    new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  renderSched();
}

// ─────────────────────────────────────────
// PHOTO HANDLING
// ─────────────────────────────────────────
async function handlePhotoFile(input) {
  const file = input.files[0];
  if (!file) return;
  const compressed = await compressImage(file);
  applyPhotoPreview(compressed);
  document.getElementById('m-photo-url').value = '';
}
function handlePhotoUrl(url) {
  url.trim() ? applyPhotoPreview(url.trim()) : clearPhoto();
}
function applyPhotoPreview(src) {
  document.getElementById('m-photo-val').value = src;
  const circle = document.getElementById('m-photo-circle');
  circle.style.background = '#1e2234';
  circle.innerHTML = `
    <img src="${escH(src)}" style="width:100%;height:100%;object-fit:cover;display:block" onerror="clearPhoto()">
    <div class="photo-circle-overlay">
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
        <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </div>`;
  circle.onclick = () => document.getElementById('m-photo-file').click();
  document.getElementById('m-photo-remove').style.display = 'inline';
}
function resetPhotoSection(name, existingPhoto) {
  const color = nameColor(name || 'X');
  const circle = document.getElementById('m-photo-circle');
  document.getElementById('m-photo-remove').style.display = existingPhoto ? 'inline' : 'none';
  document.getElementById('m-photo-url').value = existingPhoto && existingPhoto.startsWith('http') ? existingPhoto : '';
  document.getElementById('m-photo-val').value = existingPhoto || '';
  if (existingPhoto) {
    circle.style.background = '#1e2234';
    circle.innerHTML = `
      <img src="${escH(existingPhoto)}" style="width:100%;height:100%;object-fit:cover;display:block" onerror="clearPhoto()">
      <div class="photo-circle-overlay"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg></div>`;
  } else {
    circle.style.background = color;
    circle.innerHTML = `
      <span style="font-size:1.4rem;font-weight:700;color:#fff">${initials(name || '?')}</span>
      <div class="photo-circle-overlay"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg></div>`;
  }
  circle.onclick = () => document.getElementById('m-photo-file').click();
}
function clearPhoto() {
  document.getElementById('m-photo-val').value = '';
  document.getElementById('m-photo-url').value = '';
  document.getElementById('m-photo-file').value = '';
  document.getElementById('m-photo-remove').style.display = 'none';
  const name = document.getElementById('m-name').value || '?';
  const circle = document.getElementById('m-photo-circle');
  circle.style.background = nameColor(name);
  circle.innerHTML = `
    <span style="font-size:1.4rem;font-weight:700;color:#fff">${initials(name)}</span>
    <div class="photo-circle-overlay"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg></div>`;
  circle.onclick = () => document.getElementById('m-photo-file').click();
}
document.getElementById('m-name').addEventListener('input', function() {
  if (!document.getElementById('m-photo-val').value) {
    const circle = document.getElementById('m-photo-circle');
    circle.style.background = nameColor(this.value || 'X');
    const sp = circle.querySelector('span');
    if (sp) sp.textContent = initials(this.value || '?');
  }
});

// ─────────────────────────────────────────
// CITY AUTOCOMPLETE
// ─────────────────────────────────────────
function cityAC(input, ddId, valId, selectFn) {
  const q = input.value.trim().toLowerCase();
  const dd = document.getElementById(ddId);
  if (q.length < 2) { dd.style.display = 'none'; document.getElementById(valId).value = ''; return; }
  const starts   = Object.entries(CITIES).filter(([c]) => c.toLowerCase().startsWith(q));
  const contains = Object.entries(CITIES).filter(([c]) => !c.toLowerCase().startsWith(q) && c.toLowerCase().includes(q));
  const matches  = [...starts, ...contains].slice(0, 9);
  if (!matches.length) { dd.style.display = 'none'; document.getElementById(valId).value = ''; return; }
  dd.innerHTML = matches.map(([city, tz], i) => `
    <div class="city-opt" data-idx="${i}">
      <span>${escH(city)}</span>
      <span class="city-tz">${tz.split('/').pop().replace(/_/g,' ')}</span>
    </div>`).join('');
  dd._matches = matches;
  dd.onclick = e => {
    const opt = e.target.closest('.city-opt');
    if (opt) selectFn(dd._matches[+opt.dataset.idx][0], dd._matches[+opt.dataset.idx][1], input, ddId, valId);
  };
  dd.style.display = 'block';
}
function selectCity(city, tz, input, ddId, valId) {
  (input || document.getElementById('m-city')).value = city;
  document.getElementById(valId || 'm-tz-val').value = tz;
  document.getElementById(ddId || 'm-city-dd').style.display = 'none';
  document.getElementById('m-tz-row').style.display = 'none';
}
function selectTravelCity(city, tz, input, ddId, valId) {
  (input || document.getElementById('t-city')).value = city;
  document.getElementById(valId || 't-tz-val').value = tz;
  document.getElementById(ddId || 't-city-dd').style.display = 'none';
  document.getElementById('t-tz-row').style.display = 'none';
}
document.addEventListener('click', e => {
  if (!e.target.closest('.city-wrap')) document.querySelectorAll('.city-dropdown').forEach(d => d.style.display = 'none');
});

// ─────────────────────────────────────────
// MODAL: ADD / EDIT
// ─────────────────────────────────────────
let editId = null;
function populateTzSelects() {
  const opts = TZ_LIST.map(t => `<option value="${t.v}">${t.l}</option>`).join('');
  document.getElementById('m-tz-sel').innerHTML = opts;
  document.getElementById('t-tz-sel').innerHTML = opts;
}
function openAdd() {
  editId = null;
  document.getElementById('person-modal-title').textContent = 'Add Team Member';
  document.getElementById('m-name').value = '';
  document.getElementById('m-city').value = '';
  document.getElementById('m-tz-val').value = '';
  document.getElementById('m-tz-row').style.display = 'none';
  document.getElementById('m-delete-area').innerHTML = '';
  document.getElementById('m-city-dd').style.display = 'none';
  document.getElementById('m-photo-file').value = '';
  document.getElementById('modal-save-btn').textContent = 'Add Person';
  resetPhotoSection('', '');
  document.getElementById('person-overlay').style.display = 'flex';
  setTimeout(() => document.getElementById('m-name').focus(), 80);
}
function openEdit(id) {
  const p = team.find(x => x.id === id);
  if (!p) return;
  editId = id;
  document.getElementById('person-modal-title').textContent = `Edit ${p.name}`;
  document.getElementById('m-name').value = p.name;
  document.getElementById('m-city').value = p.city;
  document.getElementById('m-tz-val').value = p.tz;
  document.getElementById('m-tz-row').style.display = 'none';
  document.getElementById('m-city-dd').style.display = 'none';
  document.getElementById('m-photo-file').value = '';
  document.getElementById('modal-save-btn').textContent = 'Save Changes';
  resetPhotoSection(p.name, p.photo || '');
  document.getElementById('m-delete-area').innerHTML = `
    <hr class="modal-divider">
    <button class="remove-btn" onclick="deletePerson(${id})">Remove ${escH(p.name)} from team</button>`;
  document.getElementById('person-overlay').style.display = 'flex';
  setTimeout(() => document.getElementById('m-name').focus(), 80);
}
function closePersonModal() { document.getElementById('person-overlay').style.display = 'none'; }

async function savePersonModal() {
  const name  = document.getElementById('m-name').value.trim();
  const city  = document.getElementById('m-city').value.trim();
  const photo = document.getElementById('m-photo-val').value;
  let tz = document.getElementById('m-tz-val').value || document.getElementById('m-tz-sel').value;
  if (!name) { alert('Please enter a name.'); return; }
  if (!city) { alert('Please enter a city.'); return; }
  if (!tz)   { alert('Please choose a timezone.'); return; }

  const btn = document.getElementById('modal-save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';

  try {
    if (editId) {
      const existing = team.find(p => p.id === editId);
      await savePerson({...existing, name, city, tz, photo});
    } else {
      const id = nextId;
      await savePerson({id, name, city, tz, photo, traveling:false, travelCity:'', travelTz:'', order:id});
    }
    closePersonModal();
    showToast('Saved for everyone ✓');
  } catch(e) {
    alert('Error saving: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function deletePerson(id) {
  const p = team.find(x => x.id === id);
  if (!p || !confirm(`Remove ${p.name} from the team?`)) return;
  await removePersonFromDB(id);
  closePersonModal();
  showToast(`${p.name} removed`);
}

// ─────────────────────────────────────────
// MODAL: TRAVEL
// ─────────────────────────────────────────
let travelId = null;
function openTravel(id) {
  const p = team.find(x => x.id === id);
  if (!p) return;
  travelId = id;
  document.getElementById('travel-desc').textContent =
    `${p.name}'s home is ${p.city}. Update their location if they're currently elsewhere.`;
  document.getElementById('t-city').value = (p.traveling && p.travelCity) ? p.travelCity : '';
  document.getElementById('t-tz-val').value = (p.traveling && p.travelTz) ? p.travelTz : '';
  document.getElementById('t-tz-row').style.display = 'none';
  document.getElementById('t-city-dd').style.display = 'none';
  document.getElementById('travel-overlay').style.display = 'flex';
  setTimeout(() => document.getElementById('t-city').focus(), 80);
}
function closeTravelModal() { document.getElementById('travel-overlay').style.display = 'none'; }
async function saveTravelModal() {
  const city = document.getElementById('t-city').value.trim();
  let tz = document.getElementById('t-tz-val').value || document.getElementById('t-tz-sel').value;
  if (!city) { await clearTravel(); return; }
  if (!tz) { alert('Please choose a timezone.'); return; }
  const btn = document.getElementById('travel-save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const p = team.find(x => x.id === travelId);
    await savePerson({...p, traveling:true, travelCity:city, travelTz:tz});
    closeTravelModal();
    showToast('Location updated for everyone ✓');
  } catch(e) { alert('Error: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = 'Update'; }
}
async function clearTravel() {
  const p = team.find(x => x.id === travelId);
  if (p) {
    await savePerson({...p, traveling:false, travelCity:'', travelTz:''});
    showToast('Reset to home location ✓');
  }
  closeTravelModal();
}

// ─────────────────────────────────────────
// KEYBOARD
// ─────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePersonModal(); closeTravelModal(); }
});

// ─────────────────────────────────────────
// LOGO FALLBACK
// ─────────────────────────────────────────
(function() {
  const img = document.getElementById('logo-img');
  const fb  = document.getElementById('logo-mark-fallback');
  img.addEventListener('load',  () => { img.style.display = 'block'; fb.style.display = 'none'; });
  img.addEventListener('error', () => { img.style.display = 'none';  fb.style.display = 'flex'; });
  if (img.complete && img.naturalWidth === 0) { img.style.display = 'none'; fb.style.display = 'flex'; }
})();

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
populateTzSelects();
initSchedTime();
seedIfEmpty().then(startListener);
setInterval(renderSched, 60000);
</script>
